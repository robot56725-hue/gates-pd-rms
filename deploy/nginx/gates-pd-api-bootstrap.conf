# Temporary, HTTP-only config used ONLY during the first-ever certificate
# request (see ../setup_https.sh). There is no 443 server block here on
# purpose: nginx will refuse to start a server block that references
# ssl_certificate files that don't exist yet, which is exactly the state
# before the very first certbot run. setup_https.sh installs this file,
# reloads nginx, obtains the certificate, then overwrites this file with the
# real gates-pd-api.conf (which does have the 443/TLS block) and reloads
# again. You should never need to touch this file directly.
server {
    listen 80;
    #     listen [::]:80;  # uncomment if this host has IPv6 enabled (check: ip -6 addr)
    server_name DOMAIN_NAME_PLACEHOLDER;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Gates PD API: TLS certificate not yet provisioned. Run deploy/setup_https.sh.';
        add_header Content-Type text/plain;
    }
}
