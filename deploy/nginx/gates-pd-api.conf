# =============================================================================
# Gates Police Department RMS API -- nginx reverse-proxy / TLS-termination
# config, fronting the Node/Express app (src/server.js) run by systemd as
# the `gates-pd-api` service (see deploy/gates-pd-api.service).
#
# Install:
#   sudo cp deploy/nginx/gates-pd-api.conf /etc/nginx/sites-available/gates-pd-api.conf
#   sudo ln -s /etc/nginx/sites-available/gates-pd-api.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # avoid it catching requests first
#
# Then edit DOMAIN_NAME_PLACEHOLDER below (two occurrences) to your real
# domain, and run deploy/setup_https.sh -- see that script for the full
# first-time bootstrap sequence (it obtains the certificate BEFORE nginx
# tries to load a cert file that doesn't exist yet).
# =============================================================================

# Plain HTTP: ONLY serves the ACME HTTP-01 challenge (so certbot can renew)
# and redirects everything else straight to HTTPS. The app itself is never
# reachable over :80 -- "must run strictly over https://" means this
# fallback exists purely to make TLS possible, not as a second way in.
server {
    listen 80;
    #     listen [::]:80;  # uncomment if this host has IPv6 enabled (check: ip -6 addr)
    server_name DOMAIN_NAME_PLACEHOLDER;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` (rather than the newer standalone `http2 on;`
    # directive) is used here deliberately: `http2 on;` only works on nginx
    # >= 1.25.1, and Ubuntu 24.04 LTS -- a very common deployment target --
    # ships 1.24, which rejects it outright as an unknown directive. This
    # older form works across both.
    listen 443 ssl http2;
    #     listen [::]:443 ssl http2;  # uncomment if this host has IPv6 enabled (check: ip -6 addr)
    server_name DOMAIN_NAME_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_NAME_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_NAME_PLACEHOLDER/privkey.pem;

    # Modern, strict TLS only -- officers are submitting demographic/PII
    # data over this connection, so we do not negotiate down to anything
    # weaker than TLS 1.2, and prefer 1.3 where the client supports it.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling: lets the client verify the cert wasn't revoked without
    # its own round trip to the CA.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/DOMAIN_NAME_PLACEHOLDER/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS: tells browsers to refuse plain http:// to this host entirely for
    # the next 180 days, closing off any downgrade attempt even before the
    # first redirect. Add "preload" and submit to hstspreload.org only once
    # you're confident every subdomain in use is also HTTPS-only.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 200k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API's own req.ip / audit_logs.ip_address only reflect the real
        # client (not nginx's own 127.0.0.1) if TRUST_PROXY=true in its .env
        # -- see src/config/env.js and app.js. Leaving TRUST_PROXY unset/false
        # while nginx sits in front means every audit log row records
        # 127.0.0.1 instead of the officer's actual address.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
