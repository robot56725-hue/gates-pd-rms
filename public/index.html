<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Gates PD RMS</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ===================== LOGIN VIEW ===================== -->
  <section id="view-login" class="view">
    <div class="login-card">
      <img src="/assets/gates-pd-logo.jpg" alt="Gates Police Department" class="dept-logo" />
      <h1>Gates PD RMS</h1>
      <p class="subtitle">Records Management &amp; Court Clerk Ledger</p>
      <p class="dept-contact">Gates Police Department &middot; 10085 2nd Street, Gates, TN 38037 &middot; (731) 290-0614</p>
      <form id="login-form" novalidate>
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" required />

        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
        <p id="login-error" class="error-text" hidden></p>
      </form>
    </div>
  </section>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app-shell" class="view" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <img src="/assets/gates-pd-logo.jpg" alt="Gates Police Department" class="topbar-logo" />
        <div>
          <div class="topbar-title">Gates PD RMS</div>
          <div class="topbar-contact">10085 2nd St, Gates, TN 38037 &middot; (731) 290-0614</div>
        </div>
      </div>
      <div class="topbar-user">
        <span id="user-name"></span>
        <span id="user-role" class="badge"></span>
        <button id="logout-btn" class="btn btn-link">Log Out</button>
      </div>
    </header>

    <main id="main-content"></main>

    <nav class="bottom-nav">
      <button class="nav-btn" data-view="search">Search</button>
      <button class="nav-btn" data-view="citations">Citations</button>
      <button class="nav-btn" data-view="issue" id="nav-issue">Issue Citation</button>
      <button class="nav-btn" data-view="incidents" id="nav-incidents" hidden>Incidents</button>
      <button class="nav-btn" data-view="crashes" id="nav-crashes" hidden>Crashes</button>
      <button class="nav-btn" data-view="evidence" id="nav-evidence" hidden>Evidence</button>
      <button class="nav-btn" data-view="personnel" id="nav-personnel" hidden>Personnel</button>
    </nav>
  </div>

  <!-- ===================== TEMPLATES ===================== -->
  <template id="tpl-search">
    <section class="panel">
      <h2>Search</h2>
      <div class="scope-toggle">
        <button class="scope-btn active" data-scope="persons">People</button>
        <button class="scope-btn" data-scope="vehicles">Vehicles</button>
        <button class="scope-btn" data-scope="citations">Citations</button>
      </div>
      <form id="search-form" class="search-form">
        <input id="search-input" type="text" placeholder="Name, license plate, VIN, citation #..." />
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
      <p id="search-status" class="hint"></p>
      <ul id="search-results" class="result-list"></ul>
    </section>
  </template>

  <template id="tpl-person-detail">
    <section class="panel">
      <button class="btn btn-link back-btn">&larr; Back to search</button>
      <h2 class="person-name"></h2>
      <dl class="detail-grid">
        <dt>Date of Birth</dt><dd class="p-dob"></dd>
        <dt>Driver's License</dt><dd class="p-dl"></dd>
        <dt>DL Class</dt><dd class="p-dlclass"></dd>
        <dt>CDL</dt><dd class="p-cdl"></dd>
        <dt>Phone</dt><dd class="p-phone"></dd>
        <dt>Address</dt><dd class="p-address"></dd>
      </dl>
      <h3>Citation History</h3>
      <ul class="result-list p-citations"></ul>
    </section>
  </template>

  <template id="tpl-vehicle-detail">
    <section class="panel">
      <button class="btn btn-link back-btn">&larr; Back to search</button>
      <h2 class="vehicle-title"></h2>
      <dl class="detail-grid">
        <dt>VIN</dt><dd class="v-vin"></dd>
        <dt>Owner</dt><dd class="v-owner"></dd>
        <dt>Year</dt><dd class="v-year"></dd>
        <dt>Color</dt><dd class="v-color"></dd>
        <dt>Plate Year</dt><dd class="v-plateyear"></dd>
      </dl>
      <h3>Citation History</h3>
      <ul class="result-list v-citations"></ul>
    </section>
  </template>

  <template id="tpl-citations">
    <section class="panel">
      <h2>Citations</h2>
      <div class="filter-row">
        <label class="checkbox-label"><input type="checkbox" id="filter-mine" /> My citations only</label>
        <select id="filter-status">
          <option value="">Any status</option>
          <option value="Pending">Pending</option>
          <option value="Guilty">Guilty</option>
          <option value="Not_Guilty">Not Guilty</option>
          <option value="Dismissed">Dismissed</option>
          <option value="FTA_Failure_To_Appear">FTA / Failure to Appear</option>
        </select>
      </div>
      <ul id="citations-list" class="result-list"></ul>
      <div class="pager">
        <button id="citations-prev" class="btn btn-secondary">&larr; Prev</button>
        <span id="citations-page-info" class="hint"></span>
        <button id="citations-next" class="btn btn-secondary">Next &rarr;</button>
      </div>
    </section>
  </template>

  <template id="tpl-citation-detail">
    <section class="panel">
      <button class="btn btn-link back-btn">&larr; Back to citations</button>
      <div class="report-letterhead">
        <img src="/assets/gates-pd-logo.jpg" alt="Gates Police Department" class="report-logo" />
        <div>
          <div class="report-dept-name">Gates Police Department</div>
          <div class="report-dept-contact">10085 2nd Street, Gates, TN 38037 &middot; (731) 290-0614</div>
        </div>
      </div>
      <h2 class="c-number"></h2>
      <dl class="detail-grid">
        <dt>Violator</dt><dd class="c-violator"></dd>
        <dt>Vehicle</dt><dd class="c-vehicle"></dd>
        <dt>Officer</dt><dd class="c-officer"></dd>
        <dt>Offense Date</dt><dd class="c-offense-date"></dd>
        <dt>Location</dt><dd class="c-location"></dd>
        <dt>Offense</dt><dd class="c-description"></dd>
        <dt>T.C.A. Code</dt><dd class="c-tca"></dd>
        <dt>Court Date</dt><dd class="c-court-date"></dd>
        <dt>Court</dt><dd class="c-court-name"></dd>
        <dt>Filing Deadline</dt><dd class="c-deadline"></dd>
        <dt>Status</dt><dd class="c-status"></dd>
        <dt>Fine Due</dt><dd class="c-fine"></dd>
        <dt>Paid</dt><dd class="c-paid"></dd>
      </dl>

      <form id="ledger-form" class="ledger-form" hidden>
        <h3>Update Court Disposition</h3>
        <label for="ledger-status">Status</label>
        <select id="ledger-status">
          <option value="">-- leave unchanged --</option>
          <option value="Pending">Pending</option>
          <option value="Guilty">Guilty</option>
          <option value="Not_Guilty">Not Guilty</option>
          <option value="Dismissed">Dismissed</option>
          <option value="FTA_Failure_To_Appear">FTA / Failure to Appear</option>
        </select>
        <label for="ledger-fine">Fine Amount Due</label>
        <input id="ledger-fine" type="number" step="0.01" min="0" />
        <label for="ledger-paid">Amount Paid</label>
        <input id="ledger-paid" type="number" step="0.01" min="0" />
        <label for="ledger-payment-date">Payment Date</label>
        <input id="ledger-payment-date" type="date" />
        <label for="ledger-notes">Disposition Notes</label>
        <textarea id="ledger-notes" rows="3"></textarea>
        <button type="submit" class="btn btn-primary btn-block">Save Disposition</button>
        <p class="ledger-error error-text" hidden></p>
        <p class="ledger-success success-text" hidden></p>
      </form>
    </section>
  </template>

  <template id="tpl-issue">
    <section class="panel">
      <h2>Issue Citation</h2>
      <form id="issue-form" class="issue-form" novalidate>
        <fieldset>
          <legend>Citation</legend>
          <label for="i-citation-number">Citation Number</label>
          <input id="i-citation-number" required />
        </fieldset>

        <fieldset>
          <legend>Violator</legend>
          <label for="i-first-name">First Name</label>
          <input id="i-first-name" required />
          <label for="i-middle-name">Middle Name</label>
          <input id="i-middle-name" />
          <label for="i-last-name">Last Name</label>
          <input id="i-last-name" required />
          <label for="i-dob">Date of Birth</label>
          <input id="i-dob" type="date" required />
          <label for="i-sex">Sex</label>
          <select id="i-sex" required>
            <option value="">-- select --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Unknown">Unknown</option>
          </select>
          <label for="i-race">Race</label>
          <select id="i-race" required>
            <option value="">-- select --</option>
            <option value="White">White</option>
            <option value="Black">Black</option>
            <option value="American_Indian_Alaska_Native">American Indian / Alaska Native</option>
            <option value="Asian">Asian</option>
            <option value="Native_Hawaiian_Pacific_Islander">Native Hawaiian / Pacific Islander</option>
            <option value="Unknown">Unknown</option>
          </select>
          <label for="i-height">Height (inches)</label>
          <input id="i-height" type="number" inputmode="numeric" min="20" max="96" required />
          <label for="i-weight">Weight (lbs)</label>
          <input id="i-weight" type="number" inputmode="numeric" min="30" max="700" required />
          <label for="i-eye-color">Eye Color</label>
          <input id="i-eye-color" required />
          <label for="i-hair-color">Hair Color</label>
          <input id="i-hair-color" required />
          <label for="i-dl-num">Driver's License #</label>
          <input id="i-dl-num" required />
          <label for="i-dl-state">DL State</label>
          <input id="i-dl-state" maxlength="2" required />
          <label for="i-dl-class">DL Class</label>
          <input id="i-dl-class" required />
          <label class="checkbox-label"><input type="checkbox" id="i-is-cdl" /> Commercial Driver's License (CDL)</label>
          <label for="i-phone">Phone</label>
          <input id="i-phone" />
          <label for="i-address">Address</label>
          <input id="i-address" />
        </fieldset>

        <fieldset>
          <legend>Vehicle</legend>
          <label for="i-vin">VIN (optional)</label>
          <input id="i-vin" maxlength="17" />
          <label for="i-make">Make</label>
          <input id="i-make" required />
          <label for="i-model">Model</label>
          <input id="i-model" required />
          <label for="i-year">Year</label>
          <input id="i-year" inputmode="numeric" maxlength="4" required />
          <label for="i-color">Color</label>
          <input id="i-color" required />
          <label for="i-owner">Owner Name</label>
          <input id="i-owner" required />
          <label for="i-plate">Plate Number</label>
          <input id="i-plate" required />
          <label for="i-plate-year">Plate Year</label>
          <input id="i-plate-year" inputmode="numeric" maxlength="4" required />
          <label for="i-plate-state">Plate State</label>
          <input id="i-plate-state" maxlength="2" required />
        </fieldset>

        <fieldset>
          <legend>Offense</legend>
          <label for="i-offense-date">Offense Date</label>
          <input id="i-offense-date" type="date" required />
          <label for="i-offense-time">Offense Time</label>
          <input id="i-offense-time" type="time" required />
          <label for="i-location">Location</label>
          <input id="i-location" required />
          <div class="gps-row">
            <label for="i-latitude">Latitude</label>
            <input id="i-latitude" type="number" step="any" min="-90" max="90" required />
            <label for="i-longitude">Longitude</label>
            <input id="i-longitude" type="number" step="any" min="-180" max="180" required />
            <button type="button" id="i-use-location" class="btn btn-secondary">Use My Location</button>
            <p id="i-location-status" class="hint"></p>
          </div>
          <label for="i-description">Description</label>
          <textarea id="i-description" rows="2" required></textarea>
          <label for="i-tca">T.C.A. Code</label>
          <input id="i-tca" required />
          <label class="checkbox-label"><input type="checkbox" id="i-is-cmv" /> Commercial Motor Vehicle</label>
          <label class="checkbox-label"><input type="checkbox" id="i-is-hazmat" /> Hazmat</label>
          <label class="checkbox-label"><input type="checkbox" id="i-is-16plus" /> 16+ Passenger Capacity</label>
        </fieldset>

        <fieldset>
          <legend>Court Appearance</legend>
          <label for="i-court-date">Court Date</label>
          <input id="i-court-date" type="date" required />
          <label for="i-court-time">Court Time</label>
          <input id="i-court-time" type="time" required />
          <label for="i-court-location">Court Location</label>
          <input id="i-court-location" required />
          <label for="i-court-name">Court Name</label>
          <input id="i-court-name" required />
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block">Submit Citation</button>
        <p id="issue-error" class="error-text" hidden></p>
        <p id="issue-success" class="success-text" hidden></p>
      </form>
    </section>
  </template>

  <template id="tpl-personnel">
    <section class="panel">
      <h2>Personnel</h2>
      <p class="hint">Add, deactivate, or reactivate accounts for this department. Accounts are never deleted outright -- deactivating blocks login while keeping the account on record.</p>
      <button id="personnel-add-btn" class="btn btn-primary">+ Add Personnel</button>

      <form id="personnel-add-form" class="issue-form" hidden novalidate>
        <fieldset>
          <legend>New Account</legend>
          <label for="pn-username">Username</label>
          <input id="pn-username" required />
          <label for="pn-password">Temporary Password</label>
          <input id="pn-password" type="text" required minlength="10" />
          <label for="pn-full-name">Full Name</label>
          <input id="pn-full-name" required />
          <label for="pn-badge">Badge Number</label>
          <input id="pn-badge" required />
          <label for="pn-rank">Rank</label>
          <input id="pn-rank" />
          <label for="pn-agency">Agency</label>
          <input id="pn-agency" value="Gates Police Department" required />
          <label for="pn-role">Role</label>
          <select id="pn-role" required>
            <option value="Patrol_Officer">Patrol Officer</option>
            <option value="Supervisor">Supervisor</option>
            <option value="Court_Clerk">Court Clerk</option>
            <option value="System_Admin">System Admin</option>
          </select>
        </fieldset>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        <p id="personnel-add-error" class="error-text" hidden></p>
        <p id="personnel-add-success" class="success-text" hidden></p>
      </form>

      <ul id="personnel-list" class="result-list"></ul>
    </section>
  </template>

  <template id="tpl-incidents">
    <section class="panel">
      <h2>Incidents</h2>
      <button id="incident-new-btn" class="btn btn-primary">+ New Incident Report</button>

      <form id="incident-form" class="issue-form" hidden novalidate>
        <fieldset>
          <legend>Case Details</legend>
          <label for="in-case-number">Case Number</label>
          <input id="in-case-number" required />
          <label for="in-occurrence-date">Occurrence Date</label>
          <input id="in-occurrence-date" type="date" required />
          <label for="in-occurrence-time">Occurrence Time</label>
          <input id="in-occurrence-time" type="time" required />
          <label for="in-location-address">Location Address</label>
          <input id="in-location-address" required />
          <label for="in-location-type">Location Type</label>
          <select id="in-location-type" required>
            <option value="">-- select --</option>
            <option value="Air_Bus_Train_Terminal">Air Bus Train Terminal</option>
            <option value="Bank_Savings_Loan">Bank Savings Loan</option>
            <option value="Bar_Nightclub">Bar Nightclub</option>
            <option value="Church_Synagogue_Temple_Mosque">Church Synagogue Temple Mosque</option>
            <option value="Commercial_Office_Building">Commercial Office Building</option>
            <option value="Construction_Site">Construction Site</option>
            <option value="Convenience_Store">Convenience Store</option>
            <option value="Department_Discount_Store">Department Discount Store</option>
            <option value="Drug_Store_Doctors_Office_Hospital">Drug Store Doctors Office Hospital</option>
            <option value="Field_Woods">Field Woods</option>
            <option value="Government_Public_Building">Government Public Building</option>
            <option value="Grocery_Supermarket">Grocery Supermarket</option>
            <option value="Highway_Road_Alley_Street_Sidewalk">Highway Road Alley Street Sidewalk</option>
            <option value="Hotel_Motel">Hotel Motel</option>
            <option value="Jail_Prison">Jail Prison</option>
            <option value="Lake_Waterway_Beach">Lake Waterway Beach</option>
            <option value="Liquor_Store">Liquor Store</option>
            <option value="Parking_Lot_Garage">Parking Lot Garage</option>
            <option value="Park_Playground">Park Playground</option>
            <option value="Rental_Storage_Facility">Rental Storage Facility</option>
            <option value="Residence_Home">Residence Home</option>
            <option value="Restaurant">Restaurant</option>
            <option value="School_College">School College</option>
            <option value="Service_Gas_Station">Service Gas Station</option>
            <option value="Shopping_Mall">Shopping Mall</option>
            <option value="Specialty_Store">Specialty Store</option>
            <option value="Other">Other</option>
            <option value="Unknown">Unknown</option>
          </select>
          <div class="gps-row">
            <label for="in-latitude">Latitude (optional)</label>
            <input id="in-latitude" type="number" step="any" min="-90" max="90" />
            <label for="in-longitude">Longitude (optional)</label>
            <input id="in-longitude" type="number" step="any" min="-180" max="180" />
            <button type="button" id="in-use-location" class="btn btn-secondary">Use My Location</button>
            <p id="in-location-status" class="hint"></p>
          </div>
          <label for="in-narrative">Narrative</label>
          <textarea id="in-narrative" rows="3"></textarea>
        </fieldset>

        <fieldset>
          <legend>Offenses <span class="hint">(1-10 required)</span></legend>
          <div id="incident-offense-rows"></div>
          <button type="button" id="incident-add-offense" class="btn btn-secondary">+ Add Offense</button>
        </fieldset>

        <fieldset>
          <legend>Persons Involved <span class="hint">(victims, offenders, witnesses)</span></legend>
          <div id="incident-person-rows"></div>
          <button type="button" id="incident-add-person" class="btn btn-secondary">+ Add Person</button>
        </fieldset>

        <fieldset>
          <legend>Victim-Offender Relationships <span class="hint">(optional)</span></legend>
          <div id="incident-relationship-rows"></div>
          <button type="button" id="incident-add-relationship" class="btn btn-secondary">+ Add Relationship</button>
        </fieldset>

        <fieldset>
          <legend>Property <span class="hint">(optional)</span></legend>
          <div id="incident-property-rows"></div>
          <button type="button" id="incident-add-property" class="btn btn-secondary">+ Add Property</button>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block">Submit Incident Report</button>
        <p id="incident-form-error" class="error-text" hidden></p>
        <p id="incident-form-success" class="success-text" hidden></p>
      </form>

      <ul id="incidents-list" class="result-list"></ul>
    </section>
  </template>

  <template id="tpl-incident-detail">
    <section class="panel">
      <button class="btn btn-link back-btn">&larr; Back to incidents</button>
      <div class="report-letterhead">
        <img src="/assets/gates-pd-logo.jpg" alt="Gates Police Department" class="report-logo" />
        <div>
          <div class="report-dept-name">Gates Police Department</div>
          <div class="report-dept-contact">10085 2nd Street, Gates, TN 38037 &middot; (731) 290-0614</div>
        </div>
      </div>
      <h2 class="i-case-number"></h2>
      <dl class="detail-grid">
        <dt>Occurrence Date</dt><dd class="i-occurrence-date"></dd>
        <dt>Location</dt><dd class="i-location"></dd>
        <dt>Location Type</dt><dd class="i-location-type"></dd>
        <dt>Status</dt><dd class="i-status"></dd>
        <dt>Exceptional Clearance</dt><dd class="i-clearance"></dd>
      </dl>
      <h3>Offenses</h3>
      <ul class="result-list i-offenses"></ul>
      <h3>Persons</h3>
      <ul class="result-list i-persons"></ul>
      <h3>Victim-Offender Relationships</h3>
      <ul class="result-list i-relationships"></ul>
      <h3>Property</h3>
      <ul class="result-list i-property"></ul>
      <h3>Narrative</h3>
      <p class="i-narrative"></p>
    </section>
  </template>

  <template id="tpl-crashes">
    <section class="panel">
      <h2>Crash Reports</h2>
      <button id="crash-new-btn" class="btn btn-primary">+ New Crash Report</button>

      <form id="crash-form" class="issue-form" hidden novalidate>
        <fieldset>
          <legend>Crash Details</legend>
          <label for="cr-report-number">Report Number</label>
          <input id="cr-report-number" required />
          <label for="cr-crash-date">Crash Date</label>
          <input id="cr-crash-date" type="date" required />
          <label for="cr-crash-time">Crash Time</label>
          <input id="cr-crash-time" type="time" required />
          <label for="cr-location">Location</label>
          <input id="cr-location" required />
          <div class="gps-row">
            <label for="cr-latitude">Latitude (optional)</label>
            <input id="cr-latitude" type="number" step="any" min="-90" max="90" />
            <label for="cr-longitude">Longitude (optional)</label>
            <input id="cr-longitude" type="number" step="any" min="-180" max="180" />
            <button type="button" id="cr-use-location" class="btn btn-secondary">Use My Location</button>
            <p id="cr-location-status" class="hint"></p>
          </div>
          <label for="cr-weather">Weather Condition</label>
          <select id="cr-weather" required></select>
          <label for="cr-road-surface">Road Surface Condition</label>
          <select id="cr-road-surface" required></select>
          <label for="cr-light">Light Condition</label>
          <select id="cr-light" required></select>
          <label for="cr-severity">Crash Severity</label>
          <select id="cr-severity" required></select>
          <label for="cr-narrative">Narrative</label>
          <textarea id="cr-narrative" rows="3"></textarea>
        </fieldset>

        <fieldset>
          <legend>Vehicles <span class="hint">(1-20 required)</span></legend>
          <div id="crash-vehicle-rows"></div>
          <button type="button" id="crash-add-vehicle" class="btn btn-secondary">+ Add Vehicle</button>
        </fieldset>

        <fieldset>
          <legend>Persons <span class="hint">(drivers, passengers, pedestrians, cyclists)</span></legend>
          <div id="crash-person-rows"></div>
          <button type="button" id="crash-add-person" class="btn btn-secondary">+ Add Person</button>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block">Submit Crash Report</button>
        <p id="crash-form-error" class="error-text" hidden></p>
        <p id="crash-form-success" class="success-text" hidden></p>
      </form>

      <ul id="crashes-list" class="result-list"></ul>
    </section>
  </template>

  <template id="tpl-crash-detail">
    <section class="panel">
      <button class="btn btn-link back-btn">&larr; Back to crashes</button>
      <div class="report-letterhead">
        <img src="/assets/gates-pd-logo.jpg" alt="Gates Police Department" class="report-logo" />
        <div>
          <div class="report-dept-name">Gates Police Department</div>
          <div class="report-dept-contact">10085 2nd Street, Gates, TN 38037 &middot; (731) 290-0614</div>
        </div>
      </div>
      <h2 class="cr-report-number"></h2>
      <dl class="detail-grid">
        <dt>Crash Date</dt><dd class="cr-crash-date"></dd>
        <dt>Location</dt><dd class="cr-location"></dd>
        <dt>Severity</dt><dd class="cr-severity"></dd>
        <dt>Weather</dt><dd class="cr-weather"></dd>
        <dt>Road Surface</dt><dd class="cr-road-surface"></dd>
        <dt>Light</dt><dd class="cr-light"></dd>
        <dt>Officer</dt><dd class="cr-officer"></dd>
      </dl>
      <h3>Vehicles</h3>
      <ul class="result-list cr-vehicles"></ul>
      <h3>Persons</h3>
      <ul class="result-list cr-persons"></ul>
      <h3>Narrative</h3>
      <p class="cr-narrative"></p>
    </section>
  </template>

  <template id="tpl-evidence">
    <section class="panel">
      <h2>Evidence</h2>
      <button id="evidence-new-btn" class="btn btn-primary">+ Log Evidence Item</button>

      <form id="evidence-form" class="issue-form" hidden novalidate>
        <fieldset>
          <legend>Linked Case</legend>
          <label for="ev-case-type">Case Type</label>
          <select id="ev-case-type" required>
            <option value="incidents">Incident Report</option>
            <option value="crashes">Crash Report</option>
          </select>
          <label for="ev-case-number">Case / Report Number</label>
          <input id="ev-case-number" required />
          <button type="button" id="ev-find-case" class="btn btn-secondary">Find Case</button>
          <p id="ev-case-status" class="hint"></p>
          <ul id="ev-case-results" class="result-list"></ul>
        </fieldset>

        <fieldset>
          <legend>Item Details</legend>
          <label for="ev-item-number">Evidence Item Number</label>
          <input id="ev-item-number" required />
          <label for="ev-category">Category</label>
          <select id="ev-category" required></select>
          <label for="ev-description">Description</label>
          <textarea id="ev-description" rows="2" required></textarea>
          <label for="ev-quantity">Quantity</label>
          <input id="ev-quantity" type="number" min="1" value="1" required />
          <label for="ev-location-collected">Location Collected</label>
          <input id="ev-location-collected" />
          <label for="ev-date-collected">Date Collected</label>
          <input id="ev-date-collected" type="date" required />
          <label for="ev-storage-location">Storage Location</label>
          <input id="ev-storage-location" placeholder="e.g. Locker A-12" />
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block">Submit Evidence Item</button>
        <p id="evidence-form-error" class="error-text" hidden></p>
        <p id="evidence-form-success" class="success-text" hidden></p>
      </form>

      <ul id="evidence-list" class="result-list"></ul>
    </section>
  </template>

  <template id="tpl-evidence-detail">
    <section class="panel">
      <button class="btn btn-link back-btn">&larr; Back to evidence</button>
      <div class="report-letterhead">
        <img src="/assets/gates-pd-logo.jpg" alt="Gates Police Department" class="report-logo" />
        <div>
          <div class="report-dept-name">Gates Police Department</div>
          <div class="report-dept-contact">10085 2nd Street, Gates, TN 38037 &middot; (731) 290-0614</div>
        </div>
      </div>
      <h2 class="ev-item-number"></h2>
      <dl class="detail-grid">
        <dt>Category</dt><dd class="ev-category"></dd>
        <dt>Description</dt><dd class="ev-description"></dd>
        <dt>Quantity</dt><dd class="ev-quantity"></dd>
        <dt>Status</dt><dd class="ev-status"></dd>
        <dt>Date Collected</dt><dd class="ev-date-collected"></dd>
        <dt>Location Collected</dt><dd class="ev-location-collected"></dd>
        <dt>Storage Location</dt><dd class="ev-storage-location"></dd>
        <dt>Linked Case</dt><dd class="ev-linked-case"></dd>
        <dt>Collected By</dt><dd class="ev-collected-by"></dd>
      </dl>

      <form id="evidence-status-form">
        <label for="ev-status-select">Update Status</label>
        <select id="ev-status-select"></select>
        <label for="ev-disposition-notes">Disposition Notes</label>
        <textarea id="ev-disposition-notes" rows="2"></textarea>
        <button type="submit" class="btn btn-secondary">Save Status</button>
        <p class="ev-status-error error-text" hidden></p>
        <p class="ev-status-success success-text" hidden></p>
      </form>

      <h3>Chain of Custody</h3>
      <ul class="result-list ev-custody-log"></ul>

      <form id="custody-form">
        <label for="cu-action">Action</label>
        <select id="cu-action" required></select>
        <label for="cu-from">From Custodian</label>
        <input id="cu-from" />
        <label for="cu-to">To Custodian</label>
        <input id="cu-to" />
        <label for="cu-notes">Notes</label>
        <textarea id="cu-notes" rows="2"></textarea>
        <button type="submit" class="btn btn-primary">Add Custody Entry</button>
        <p class="cu-error error-text" hidden></p>
        <p class="cu-success success-text" hidden></p>
      </form>
    </section>
  </template>

  <script src="/app.js"></script>
</body>
</html>
