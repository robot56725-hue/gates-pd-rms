<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Gates PD RMS</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ===================== LOGIN VIEW ===================== -->
  <section id="view-login" class="view">
    <div class="login-card">
      <img src="/assets/gates-pd-logo.jpg" alt="Gates Police Department" class="dept-logo" />
      <h1>Gates PD RMS</h1>
      <p class="subtitle">Records Management &amp; Court Clerk Ledger</p>
      <p class="dept-contact">Gates Police Department &middot; 10085 2nd Street, Gates, TN 38037 &middot; (731) 290-0614</p>
      <form id="login-form" novalidate>
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" required />

        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
        <p id="login-error" class="error-text" hidden></p>
      </form>
    </div>
  </section>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app-shell" class="view" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <img src="/assets/gates-pd-logo.jpg" alt="Gates Police Department" class="topbar-logo" />
        <div>
          <div class="topbar-title">Gates PD RMS</div>
          <div class="topbar-contact">10085 2nd St, Gates, TN 38037 &middot; (731) 290-0614</div>
        </div>
      </div>
      <div class="topbar-user">
        <span id="user-name"></span>
        <span id="user-role" class="badge"></span>
        <button id="logout-btn" class="btn btn-link">Log Out</button>
      </div>
    </header>

    <main id="main-content"></main>

    <nav class="bottom-nav">
      <button class="nav-btn" data-view="search">Search</button>
      <button class="nav-btn" data-view="citations">Citations</button>
      <button class="nav-btn" data-view="issue" id="nav-issue">Issue Citation</button>
      <button class="nav-btn" data-view="incidents" id="nav-incidents" hidden>Incidents</button>
      <button class="nav-btn" data-view="crashes" id="nav-crashes" hidden>Crashes</button>
      <button class="nav-btn" data-view="evidence" id="nav-evidence" hidden>Evidence</button>
      <button class="nav-btn" data-view="cases" id="nav-cases" hidden>Cases</button>
      <button class="nav-btn" data-view="court-admin" id="nav-court-admin" hidden>Court</button>
      <button class="nav-btn" data-view="personnel" id="nav-personnel" hidden>Personnel</button>
    </nav>
  </div>

  <!-- ===================== TEMPLATES ===================== -->
  <template id="tpl-search">
    <section class="panel">
      <h2>Search</h2>
      <div class="scope-toggle">
        <button class="scope-btn active" data-scope="persons">People</button>
        <button class="scope-btn" data-scope="vehicles">Vehicles</button>
        <button class="scope-btn" data-scope="citations">Citations</button>
        <button class="scope-btn" data-scope="incidents">Incidents</button>
        <button class="scope-btn" data-scope="crashes">Crashes</button>
        <button class="scope-btn" data-scope="evidence">Evidence</button>
      </div>
      <form id="search-form" class="search-form">
        <input id="search-input" type="text" placeholder="Name, license plate, VIN, citation #..." />
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
      <p id="search-status" class="hint"></p>
      <ul id="search-results" class="result-list"></ul>
    </section>
  </template>

  <template id="tpl-person-detail">
    <section class="panel">
      <button class="btn btn-link back-btn">&larr; Back to search</button>
      <h2 class="person-name"></h2>
      <dl class="detail-grid">
        <dt>Date of Birth</dt><dd class="p-dob"></dd>
        <dt>Driver's License</dt><dd class="p-dl"></dd>
        <dt>DL Class</dt><dd class="p-dlclass"></dd>
        <dt>CDL</dt><dd class="p-cdl"></dd>
        <dt>Phone</dt><dd class="p-phone"></dd>
        <dt>Address</dt><dd class="p-address"></dd>
      </dl>
      <h3>Citation History</h3>
      <ul class="result-list p-citations"></ul>
    </section>
  </template>

  <template id="tpl-vehicle-detail">
    <section class="panel">
      <button class="btn btn-link back-btn">&larr; Back to search</button>
      <h2 class="vehicle-title"></h2>
      <dl class="detail-grid">
        <dt>VIN</dt><dd class="v-vin"></dd>
        <dt>Owner</dt><dd class="v-owner"></dd>
        <dt>Year</dt><dd class="v-year"></dd>
        <dt>Color</dt><dd class="v-color"></dd>
        <dt>Plate Year</dt><dd class="v-plateyear"></dd>
      </dl>
      <h3>Citation History</h3>
      <ul class="result-list v-citations"></ul>
    </section>
  </template>

  <template id="tpl-citations">
    <section class="panel">
      <h2>Citations</h2>
      <div class="filter-row">
        <label class="checkbox-label"><input type="checkbox" id="filter-mine" /> My citations only</label>
        <select id="filter-status">
          <option value="">Any status</option>
          <option value="Pending">Pending</option>
          <option value="Guilty">Guilty</option>
          <option value="Not_Guilty">Not Guilty</option>
          <option value="Dismissed">Dismissed</option>
          <option value="FTA_Failure_To_Appear">FTA / Failure to Appear</option>
        </select>
      </div>
      <ul id="citations-list" class="result-list"></ul>
      <div class="pager">
        <button id="citations-prev" class="btn btn-secondary">&larr; Prev</button>
        <span id="citations-page-info" class="hint"></span>
        <button id="citations-next" class="btn btn-secondary">Next &rarr;</button>
      </div>
    </section>
  </template>

  <template id="tpl-citation-detail">
    <section class="panel">
      <div class="detail-toolbar no-print">
        <button class="btn btn-link back-btn">&larr; Back to citations</button>
        <button class="btn btn-secondary print-btn">Print</button>
      </div>
      <div class="report-letterhead">
        <img src="/assets/gates-pd-logo.jpg" alt="Gates Police Department" class="report-logo" />
        <div>
          <div class="report-dept-name">Gates Police Department</div>
          <div class="report-dept-contact">10085 2nd Street, Gates, TN 38037 &middot; (731) 290-0614</div>
        </div>
      </div>

      <div class="citation-ticket">
        <div class="ticket-title-row">
          <div class="ticket-title">
            <div class="ticket-state">State of Tennessee &mdash; Uniform Traffic Citation and Complaint</div>
            <div class="ticket-authority">City of Gates &middot; Gates Municipal Court</div>
          </div>
          <div class="ticket-number-box">
            <div class="ticket-number-label">Citation No.</div>
            <div class="c-number ticket-number-value"></div>
            <p class="c-approval-badge approval-badge"></p>
          </div>
        </div>

        <div class="ticket-section">
          <h3 class="ticket-section-title">Violator</h3>
          <div class="ticket-grid">
            <div class="field field-wide"><span class="field-label">Name</span><span class="field-value c-violator-name"></span></div>
            <div class="field"><span class="field-label">DOB</span><span class="field-value c-violator-dob"></span></div>
            <div class="field"><span class="field-label">Sex</span><span class="field-value c-violator-sex"></span></div>
            <div class="field"><span class="field-label">Race</span><span class="field-value c-violator-race"></span></div>
            <div class="field"><span class="field-label">Height</span><span class="field-value c-violator-height"></span></div>
            <div class="field"><span class="field-label">Weight</span><span class="field-value c-violator-weight"></span></div>
            <div class="field"><span class="field-label">Eyes</span><span class="field-value c-violator-eyes"></span></div>
            <div class="field"><span class="field-label">Hair</span><span class="field-value c-violator-hair"></span></div>
            <div class="field field-wide"><span class="field-label">Address</span><span class="field-value c-violator-address"></span></div>
            <div class="field"><span class="field-label">Driver License #</span><span class="field-value c-violator-dl"></span></div>
            <div class="field"><span class="field-label">DL State</span><span class="field-value c-violator-dl-state"></span></div>
            <div class="field"><span class="field-label">Class</span><span class="field-value c-violator-dl-class"></span></div>
            <div class="field"><span class="field-label">CDL</span><span class="field-value c-violator-cdl"></span></div>
          </div>
        </div>

        <div class="ticket-section">
          <h3 class="ticket-section-title">Vehicle</h3>
          <div class="ticket-grid">
            <div class="field"><span class="field-label">Plate #</span><span class="field-value c-plate"></span></div>
            <div class="field"><span class="field-label">Plate State</span><span class="field-value c-plate-state"></span></div>
            <div class="field"><span class="field-label">Plate Year</span><span class="field-value c-plate-year"></span></div>
            <div class="field"><span class="field-label">Vehicle Year</span><span class="field-value c-vehicle-year"></span></div>
            <div class="field"><span class="field-label">Make</span><span class="field-value c-make"></span></div>
            <div class="field"><span class="field-label">Model</span><span class="field-value c-model"></span></div>
            <div class="field"><span class="field-label">Color</span><span class="field-value c-color"></span></div>
            <div class="field field-wide"><span class="field-label">VIN</span><span class="field-value c-vin"></span></div>
            <div class="field field-wide"><span class="field-label">Registered Owner</span><span class="field-value c-owner"></span></div>
          </div>
        </div>

        <div class="ticket-section">
          <h3 class="ticket-section-title">Offense</h3>
          <div class="ticket-grid">
            <div class="field"><span class="field-label">Date</span><span class="field-value c-offense-date"></span></div>
            <div class="field"><span class="field-label">Time</span><span class="field-value c-offense-time"></span></div>
            <div class="field field-wide"><span class="field-label">Location</span><span class="field-value c-location"></span></div>
            <div class="field field-full"><span class="field-label">Description of Offense</span><span class="field-value c-description"></span></div>
            <div class="field"><span class="field-label">T.C.A. Code</span><span class="field-value c-tca"></span></div>
            <div class="field"><span class="field-label">Speed Detection</span><span class="field-value c-speed-detection"></span></div>
            <div class="field field-wide">
              <span class="field-label">Vehicle/Load Type</span>
              <span class="checkbox-flags">
                <span class="flag c-flag-cmv">CMV</span>
                <span class="flag c-flag-hazmat">Hazmat</span>
                <span class="flag c-flag-16plus">16+ Passenger</span>
              </span>
            </div>
          </div>
        </div>

        <div class="ticket-section">
          <h3 class="ticket-section-title">Issuing Officer</h3>
          <div class="ticket-grid">
            <div class="field field-wide"><span class="field-label">Officer</span><span class="field-value c-officer"></span></div>
            <div class="field"><span class="field-label">Agency</span><span class="field-value c-agency"></span></div>
            <div class="field"><span class="field-label">Agency ORI</span><span class="field-value">TN049044</span></div>
          </div>
        </div>

        <div class="ticket-two-col">
          <div class="ticket-col ticket-col-complaint">
            <h3 class="ticket-section-title">Complaint</h3>
            <p class="ticket-legal-text">The undersigned officer, being duly sworn, states that on the date and at the time and place shown above, the above-named defendant did unlawfully commit the offense described above, in violation of the Tennessee Code Annotated section cited, contrary to the statute in such case made and provided and against the peace and dignity of the State of Tennessee.</p>
            <p class="hint">Issued under authority of T.C.A. &sect; 55-10-207 in lieu of physical arrest for the offense charged.</p>
          </div>
          <div class="ticket-col ticket-col-notice">
            <h3 class="ticket-section-title">Notice to Appear</h3>
            <div class="ticket-grid">
              <div class="field field-wide"><span class="field-label">Court Date/Time</span><span class="field-value c-court-date"></span></div>
              <div class="field field-wide"><span class="field-label">Court</span><span class="field-value c-court-name"></span></div>
              <div class="field field-wide"><span class="field-label">Filing Deadline</span><span class="field-value c-deadline"></span></div>
            </div>
            <p class="ticket-legal-text">You are required by law to appear at the court above on the date and time shown. <strong>Failure to appear as required is punishable as contempt of court and may result in suspension of your driving privileges.</strong> To handle this citation before your court date, contact the Gates Municipal Court Clerk at 10085 2nd Street, Gates, TN 38037, (731) 836-7501.</p>
          </div>
        </div>

        <div class="ticket-section ticket-disposition">
          <h3 class="ticket-section-title">Court Disposition</h3>
          <div class="ticket-grid">
            <div class="field"><span class="field-label">Status</span><span class="field-value c-status"></span></div>
            <div class="field"><span class="field-label">Fine Due</span><span class="field-value c-fine"></span></div>
            <div class="field"><span class="field-label">Paid</span><span class="field-value c-paid"></span></div>
          </div>
        </div>

        <div class="ticket-signature-row">
          <div class="signature-block">
            <p class="hint">My signature below acknowledges only that I have received a copy of this citation and I promise to appear at the time and place stated above, or otherwise satisfy this citation as instructed. This is <strong>not</strong> an admission of guilt.</p>
            <img class="c-signature-img" alt="Violator signature" hidden />
            <p class="c-signature-refused hint" hidden><em>Violator refused to sign.</em></p>
            <div class="signature-line-label">Violator's Signature</div>
          </div>
          <div class="officer-signature-block">
            <div class="officer-signature-line"></div>
            <div class="signature-line-label">Issuing Officer's Signature &mdash; <span class="c-officer-2"></span></div>
          </div>
        </div>
      </div>

      <div class="approval-section no-print">
        <h3>Approval</h3>
        <p class="c-approval-detail hint"></p>
        <form id="citation-approval-form" hidden>
          <label for="citation-approval-notes">Notes (optional)</label>
          <textarea id="citation-approval-notes" rows="2"></textarea>
          <div class="approval-actions">
            <button type="button" class="btn btn-primary" data-decision="Approved">Approve</button>
            <button type="button" class="btn btn-secondary btn-danger" data-decision="Rejected">Reject</button>
          </div>
          <p class="c-approval-error error-text" hidden></p>
          <p class="c-approval-success success-text" hidden></p>
        </form>
      </div>

      <div class="edit-section no-print">
        <button class="btn btn-secondary edit-toggle-btn" id="citation-edit-toggle">Edit Citation</button>
        <form id="citation-edit-form" hidden>
          <label for="ce-description">Offense Description</label>
          <textarea id="ce-description" rows="2"></textarea>
          <label for="ce-tca">T.C.A. Code</label>
          <input id="ce-tca" />
          <label for="ce-speed-detection">Speed Detection Method</label>
          <select id="ce-speed-detection">
            <option value="">-- leave unchanged --</option>
            <option value="Radar">Radar</option>
            <option value="Lidar">Lidar</option>
            <option value="Paced">Paced</option>
            <option value="VASCAR">VASCAR</option>
            <option value="Visual_Estimation">Visual Estimation</option>
            <option value="Not_Applicable">Not Applicable</option>
          </select>
          <label for="ce-location">Location</label>
          <input id="ce-location" />
          <div class="gps-row">
            <label for="ce-latitude">Latitude</label>
            <input id="ce-latitude" type="number" step="any" min="-90" max="90" />
            <label for="ce-longitude">Longitude</label>
            <input id="ce-longitude" type="number" step="any" min="-180" max="180" />
          </div>
          <label for="ce-court-date">Court Date</label>
          <input id="ce-court-date" type="date" />
          <label for="ce-court-time">Court Time</label>
          <input id="ce-court-time" type="time" />
          <label for="ce-court-location">Court Location</label>
          <input id="ce-court-location" />
          <label for="ce-court-name">Court Name</label>
          <input id="ce-court-name" />
          <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
          <p class="ce-error error-text" hidden></p>
          <p class="ce-success success-text" hidden></p>
        </form>
      </div>

      <form id="ledger-form" class="ledger-form no-print" hidden>
        <h3>Update Court Disposition</h3>
        <label for="ledger-status">Status</label>
        <select id="ledger-status">
          <option value="">-- leave unchanged --</option>
          <option value="Pending">Pending</option>
          <option value="Guilty">Guilty</option>
          <option value="Not_Guilty">Not Guilty</option>
          <option value="Dismissed">Dismissed</option>
          <option value="FTA_Failure_To_Appear">FTA / Failure to Appear</option>
        </select>
        <label for="ledger-fine">Fine Amount Due</label>
        <input id="ledger-fine" type="number" step="0.01" min="0" />
        <label for="ledger-paid">Amount Paid</label>
        <input id="ledger-paid" type="number" step="0.01" min="0" />
        <label for="ledger-payment-date">Payment Date</label>
        <input id="ledger-payment-date" type="date" />
        <label for="ledger-notes">Disposition Notes</label>
        <textarea id="ledger-notes" rows="3"></textarea>
        <button type="submit" class="btn btn-primary btn-block">Save Disposition</button>
        <p class="ledger-error error-text" hidden></p>
        <p class="ledger-success success-text" hidden></p>
      </form>
    </section>
  </template>

  <template id="tpl-issue">
    <section class="panel">
      <h2>Issue Citation</h2>
      <form id="issue-form" class="issue-form" novalidate>
        <fieldset>
          <legend>Citation</legend>
          <label for="i-citation-number">Citation Number</label>
          <input id="i-citation-number" required />
        </fieldset>

        <fieldset>
          <legend>Violator</legend>
          <label for="i-first-name">First Name</label>
          <input id="i-first-name" required />
          <label for="i-middle-name">Middle Name</label>
          <input id="i-middle-name" />
          <label for="i-last-name">Last Name</label>
          <input id="i-last-name" required />
          <label for="i-dob">Date of Birth</label>
          <input id="i-dob" type="date" required />
          <label for="i-sex">Sex</label>
          <select id="i-sex" required>
            <option value="">-- select --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Unknown">Unknown</option>
          </select>
          <label for="i-race">Race</label>
          <select id="i-race" required>
            <option value="">-- select --</option>
            <option value="White">White</option>
            <option value="Black">Black</option>
            <option value="American_Indian_Alaska_Native">American Indian / Alaska Native</option>
            <option value="Asian">Asian</option>
            <option value="Native_Hawaiian_Pacific_Islander">Native Hawaiian / Pacific Islander</option>
            <option value="Unknown">Unknown</option>
          </select>
          <label for="i-height">Height (inches)</label>
          <input id="i-height" type="number" inputmode="numeric" min="20" max="96" required />
          <label for="i-weight">Weight (lbs)</label>
          <input id="i-weight" type="number" inputmode="numeric" min="30" max="700" required />
          <label for="i-eye-color">Eye Color</label>
          <input id="i-eye-color" required />
          <label for="i-hair-color">Hair Color</label>
          <input id="i-hair-color" required />
          <label for="i-dl-num">Driver's License #</label>
          <input id="i-dl-num" required />
          <label for="i-dl-state">DL State</label>
          <input id="i-dl-state" maxlength="2" required />
          <label for="i-dl-class">DL Class</label>
          <input id="i-dl-class" required />
          <label class="checkbox-label"><input type="checkbox" id="i-is-cdl" /> Commercial Driver's License (CDL)</label>
          <label for="i-phone">Phone</label>
          <input id="i-phone" />
          <label for="i-address">Address</label>
          <input id="i-address" />
        </fieldset>

        <fieldset>
          <legend>Vehicle</legend>
          <label for="i-vin">VIN (optional)</label>
          <input id="i-vin" maxlength="17" />
          <label for="i-make">Make</label>
          <input id="i-make" required />
          <label for="i-model">Model</label>
          <input id="i-model" required />
          <label for="i-year">Year</label>
          <input id="i-year" inputmode="numeric" maxlength="4" required />
          <label for="i-color">Color</label>
          <input id="i-color" required />
          <label for="i-owner">Owner Name</label>
          <input id="i-owner" required />
          <label for="i-plate">Plate Number</label>
          <input id="i-plate" required />
          <label for="i-plate-year">Plate Year</label>
          <input id="i-plate-year" inputmode="numeric" maxlength="4" required />
          <label for="i-plate-state">Plate State</label>
          <input id="i-plate-state" maxlength="2" required />
        </fieldset>

        <fieldset>
          <legend>Offense</legend>
          <label for="i-offense-date">Offense Date</label>
          <input id="i-offense-date" type="date" required />
          <label for="i-offense-time">Offense Time</label>
          <input id="i-offense-time" type="time" required />
          <label for="i-location">Location</label>
          <input id="i-location" required />
          <div class="gps-row">
            <label for="i-latitude">Latitude</label>
            <input id="i-latitude" type="number" step="any" min="-90" max="90" required />
            <label for="i-longitude">Longitude</label>
            <input id="i-longitude" type="number" step="any" min="-180" max="180" required />
            <button type="button" id="i-use-location" class="btn btn-secondary">Use My Location</button>
            <p id="i-location-status" class="hint"></p>
          </div>
          <label for="i-description">Description</label>
          <textarea id="i-description" rows="2" required></textarea>
          <label for="i-tca">T.C.A. Code</label>
          <input id="i-tca" required />
          <label class="checkbox-label"><input type="checkbox" id="i-is-cmv" /> Commercial Motor Vehicle</label>
          <label class="checkbox-label"><input type="checkbox" id="i-is-hazmat" /> Hazmat</label>
          <label class="checkbox-label"><input type="checkbox" id="i-is-16plus" /> 16+ Passenger Capacity</label>
          <label for="i-speed-detection">Speed Detection Method (if applicable)</label>
          <select id="i-speed-detection">
            <option value="">-- not applicable / none --</option>
            <option value="Radar">Radar</option>
            <option value="Lidar">Lidar</option>
            <option value="Paced">Paced</option>
            <option value="VASCAR">VASCAR</option>
            <option value="Visual_Estimation">Visual Estimation</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Court Appearance</legend>
          <label for="i-court-date">Court Date</label>
          <input id="i-court-date" type="date" required />
          <label for="i-court-time">Court Time</label>
          <input id="i-court-time" type="time" required />
          <label for="i-court-location">Court Location</label>
          <input id="i-court-location" required />
          <label for="i-court-name">Court Name</label>
          <input id="i-court-name" required />
        </fieldset>

        <fieldset>
          <legend>Violator Signature <span class="hint">(per T.C.A. 55-10-207)</span></legend>
          <p class="hint">Have the violator sign below to acknowledge receipt of this citation and a promise to appear, or check "Refused to Sign" if they will not.</p>
          <canvas id="i-signature-pad" class="signature-pad" width="600" height="180"></canvas>
